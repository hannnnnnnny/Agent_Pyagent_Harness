name: Bug report
description: Something in guardrun does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report sandbox escapes, policy bypasses, or secret leaks here.
        Use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the output you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: guardrun version
      placeholder: "output of `guardrun --version`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "e.g. Windows 11, Python 3.12"
