[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyagent"
version = "0.1.0"
description = "A powerful, safety-first agent harness for Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yi Han" }]
dependencies = ["anthropic>=1.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[tool.ruff.format]
line-ending = "lf"
