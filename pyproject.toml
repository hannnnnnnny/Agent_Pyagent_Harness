[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "guardrun"
version = "0.1.0"
description = "A powerful, safety-first agent harness for DeepSeek and Claude models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yi Han" }]
keywords = ["agent", "deepseek", "claude", "anthropic", "llm", "sandbox", "tool-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = ["anthropic>=1.9", "tomli>=2.0; python_version < '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/guardrun"]

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml"]

[project.urls]
Homepage = "https://github.com/hannnnnnnny/GuardRun"
Documentation = "https://github.com/hannnnnnnny/GuardRun/tree/main/docs"
Changelog = "https://github.com/hannnnnnnny/GuardRun/blob/main/CHANGELOG.md"
Issues = "https://github.com/hannnnnnnny/GuardRun/issues"

[project.scripts]
guardrun = "guardrun.cli.main:main"

[project.optional-dependencies]
# tomli lets mypy check the Python 3.10 import path from any interpreter.
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.9", "mypy>=2.3.1", "tomli>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PL"]
# Tool subclasses declare schemas as class attributes typed ClassVar on the base.
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake credentials as canaries on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = ["guardrun"]
branch = true
omit = ["*/guardrun/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
