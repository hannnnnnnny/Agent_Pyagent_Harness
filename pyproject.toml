[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pyagent"
version = "0.1.0"
description = "A powerful, safety-first agent harness for Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yi Han" }]
dependencies = ["anthropic>=1.9", "tomli>=2.0; python_version < '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent"]

[project.scripts]
pyagent = "pyagent.cli.main:main"

[project.optional-dependencies]
# tomli lets mypy check the Python 3.10 import path from any interpreter.
dev = ["pytest>=9.1.1", "pytest-cov>=6.0", "ruff>=0.16.9", "mypy>=2.3.1", "tomli>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PL"]
# Tool subclasses declare schemas as class attributes typed ClassVar on the base.
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = ["pyagent"]
branch = true
omit = ["*/pyagent/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
